services:
  - type: web
    name: paymethodfinder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # RENDER_EXTERNAL_HOSTNAME is added to ALLOWED_HOSTS automatically.
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Set these to get an admin account after each deploy (the database is
      # disposable). Leave unset to skip creating one.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # REQUIRED. The shared password for the app itself; set it in the
      # service's Environment tab before the first deploy. There is no default
      # -- the service will not start until this is set. Change it here to
      # rotate it (note: tokens already handed out stay valid, see README).
      - key: APP_PASSWORD
        sync: false
      # Guesses allowed per client IP against that one password.
      - key: APP_ACCESS_THROTTLE_RATE
        value: 10/hour
      # Render puts exactly one proxy in front of this service, so the last
      # X-Forwarded-For entry is the real client. Throttling keys off it.
      - key: DJANGO_NUM_PROXIES
        value: "1"
      # Add DATABASE_URL later to switch from SQLite to PostgreSQL.
