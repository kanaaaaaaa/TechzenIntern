<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Ledger — Edit store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="store-data.js"></script>
</head>
<body>

<div class="rig">
  <div class="phone">
    <section class="screen active">
      <span class="eyebrow-stamp" id="detail-updated">updated —</span>
      <h1 class="page-title" id="detail-title">Store</h1>
      <p class="page-sub">Payment methods</p>

      <div id="method-rows"></div>

      <div class="detail-footer">
        <a class="ok-btn" href="list.html" style="text-align:center; text-decoration:none;" onclick="return saveDetail()">OK</a>
      </div>
      <div class="toast" id="toast">Saved</div>
    </section>
  </div>
</div>

<script>
  const METHOD_LABELS = { emoney:'e-money', qr:'QR', credit:'credit', cash:'cash' };
  const id = new URLSearchParams(location.search).get('id');
  const store = StoreDB.get(id) || StoreDB.getAll()[0];

  function renderDetail(){
    document.getElementById('detail-title').textContent = store.name;
    document.getElementById('detail-updated').textContent = 'updated ' + store.updated;

    document.getElementById('method-rows').innerHTML = Object.keys(store.methods).map(k => `
      <div class="method-row">
        <span class="m-name">${METHOD_LABELS[k]}</span>
        <div class="ox-toggle">
          <button class="ox-btn ok ${store.methods[k] ? 'selected' : ''}" onclick="setMethod('${k}', true)">〇</button>
          <button class="ox-btn no ${store.methods[k] ? '' : 'selected'}" onclick="setMethod('${k}', false)">×</button>
        </div>
      </div>
    `).join('');
  }

  function setMethod(key, value){
    store.methods[key] = value;
    renderDetail();
  }

  function saveDetail(){
    StoreDB.update(store.id, { name: store.name, methods: store.methods });
    const toast = document.getElementById('toast');
    toast.textContent = 'Saved · ' + store.name;
    toast.classList.add('show');
    // let the toast flash briefly before the link navigates to list.html
    return true;
  }

  renderDetail();
</script>
</body>
</html>
