<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Ledger — Stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="store-data.js"></script>
</head>
<body>

<div class="rig">
  <div class="phone">
    <section class="screen active">
      <div class="search-field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="list-search" placeholder="Search stores…" oninput="renderList()">
      </div>

      <div class="list-head">
        <span>Store name</span>
        <span>Updated</span>
        <span class="method-head"><span>e</span><span>QR</span><span>cr</span><span>ca</span></span>
        <span></span>
      </div>

      <div class="store-rows" id="store-rows"></div>

      <a class="home-fab" title="Home" href="home.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>
    </section>
  </div>
</div>

<script>
  function renderList(){
    const q = (document.getElementById('list-search').value || '').toLowerCase().trim();
    const rows = document.getElementById('store-rows');
    const filtered = StoreDB.getAll().filter(s => s.name.toLowerCase().includes(q));
    rows.innerHTML = filtered.map(s => `
      <div class="store-row">
        <div class="s-name">${s.name}</div>
        <div class="s-date">${s.updated}</div>
        <div class="methods">
          ${['emoney','qr','credit','cash'].map(k => `<span class="mark ${s.methods[k] ? 'yes' : 'no'}">${s.methods[k] ? '○' : '×'}</span>`).join('')}
        </div>
        <a class="edit-btn" href="detail.html?id=${s.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </a>
      </div>
    `).join('') || `<div style="padding:24px 0; color:var(--ink-soft); font-size:13px; text-align:center;">No stores match "${q}".</div>`;
  }

  // pre-fill the search box from ?q= if the user arrived from Research
  const params = new URLSearchParams(location.search);
  if(params.get('q')) document.getElementById('list-search').value = params.get('q');
  renderList();
</script>
</body>
</html>
